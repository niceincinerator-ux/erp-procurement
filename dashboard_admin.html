<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Admin - Procurement & Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-4 font-sans">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg mt-4 border-t-8 border-indigo-600">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-extrabold text-indigo-800">🏢 Portal Admin Gudang & Proc</h1>
                <p class="text-sm text-gray-500">Antrean Barang Keluar & Draf Pembelian</p>
            </div>
            <button onclick="muatDataAdmin()" class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded font-bold hover:bg-indigo-200">
                🔄 Refresh
            </button>
        </div>

        <div id="loadingMsg" class="text-center text-gray-500 font-semibold my-8">Sedang memeriksa sistem...</div>

        <div id="areaAdmin" class="space-y-4 hidden"></div>
    </div>

    <script>
        const apiURL = "https://script.google.com/macros/s/AKfycbyM05uzrvk0c-axvGlRWO5539PeXgytASeJSb2Lohg90hXU59KcAnk6uan86eWLmiLLsA/exec"; // <-- GANTI URL
        
        async function muatDataAdmin() {
            const area = document.getElementById('areaAdmin');
            const loadMsg = document.getElementById('loadingMsg');
            
            area.innerHTML = ''; area.classList.add('hidden'); loadMsg.classList.remove('hidden');
            loadMsg.innerHTML = "Mengambil data gudang dan procurement...";

            try {
                const response = await fetch(apiURL + "?action=getAdminData");
                const result = await response.json();

                if(result.status === "success") {
                    const data = result.data;
                    if(data.length === 0) {
                        loadMsg.innerHTML = "Mulus! Tidak ada antrean gudang maupun PO saat ini.";
                        return;
                    }
                    loadMsg.classList.add('hidden'); area.classList.remove('hidden');

                    let html = '';
                    data.forEach(tiket => {
                        const isGudang = tiket.Status_Request === "Menunggu_Gudang";
                        
                        // Kartu berbeda warna tergantung rute (Gudang vs Procurement)
                        html += `
                        <div class="border ${isGudang ? 'border-green-300 bg-green-50' : 'border-orange-300 bg-orange-50'} rounded-lg p-4 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="flex-1">
                                <span class="${isGudang ? 'bg-green-600' : 'bg-orange-500'} text-white text-xs font-bold px-2 py-1 rounded shadow">${tiket.Status_Request.replace('_', ' ')}</span>
                                <h3 class="text-lg font-bold text-gray-800 mt-2">${tiket.Nama_Barang}</h3>
                                <p class="text-sm text-gray-600">No: <b>${tiket.Req_ID}</b> | Pemohon: ${tiket.User_Peminta} (${tiket.Departemen})</p>
                                <p class="text-sm text-gray-800 mt-1">Jumlah: <b class="text-lg">${tiket.Jumlah_Diminta}</b></p>
                            </div>
                            
                            <div class="w-full md:w-auto">
                                ${isGudang ? 
                                `<button onclick="serahkanBarang('${tiket.Req_ID}')" class="w-full bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 shadow-md transition">
                                    📦 Serahkan Barang
                                </button>` 
                                : 
                                `<button disabled class="w-full bg-orange-300 text-white font-bold py-3 px-6 rounded-lg cursor-not-allowed border border-orange-400">
                                    🛒 Proses PO (Coming Soon di V2)
                                </button>`}
                            </div>
                        </div>
                        `;
                    });
                    area.innerHTML = html;
                } else { loadMsg.innerHTML = "Gagal memuat: " + result.message; }
            } catch (error) { loadMsg.innerHTML = "Error koneksi server."; }
        }

        async function serahkanBarang(reqID) {
            if(!confirm(`Serahkan barang untuk tiket ${reqID}?\nStok akan dipotong otomatis dan dicatat di Log Mutasi.`)) return;

            try {
                document.getElementById('loadingMsg').classList.remove('hidden');
                document.getElementById('loadingMsg').innerHTML = `⏳ Mengeksekusi mutasi ${reqID}...`;
                document.getElementById('areaAdmin').classList.add('hidden');

                const response = await fetch(apiURL, {
                    method: 'POST', body: JSON.stringify({ action: "mutasiGudang", req_id: reqID })
                });
                const result = await response.json();

                if(result.status === "success") { alert(`✅ Sukses: ${result.message}`); muatDataAdmin(); } 
                else { alert("❌ Gagal: " + result.message); muatDataAdmin(); }
            } catch (error) { alert("❌ Terjadi kesalahan jaringan."); muatDataAdmin(); }
        }

        muatDataAdmin();
    </script>
</body>
</html>
